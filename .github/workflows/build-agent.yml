name: Build Agente de Impressao (.exe)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['print-agent/**', '.github/workflows/build-agent.yml']
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller pystray pillow pywin32
      - run: pyinstaller --onefile --noconsole --name agenteprint --distpath print-agent/dist --workpath build/w --specpath build print-agent/fbre_print_agent.py
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Gerar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" print-agent\fbre-agent.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: agenteprint
          path: |
            print-agent/installer/agenteprint-setup.exe
            print-agent/dist/agenteprint.exe
      - name: Publicar no Releases (link fixo, sem login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agente-latest
          name: Agente de Impressao (ultimo build)
          files: print-agent/installer/agenteprint-setup.exe
          make_latest: true
